[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "local-ai-doctor"
version = "0.1.7"
description = "Local-first model inference and observability workbench"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Aksh Desai" }]
dependencies = [
  "aiosqlite==0.22.1",
  "fastapi==0.141.1",
  "numpy==2.5.3",
  "psutil==7.2.2",
  "pydantic==2.13.5",
  "python-multipart==0.0.32",
  "PyYAML==6.0.3",
  "safetensors==0.8.0",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
ml = [
  "accelerate==1.10.1",
  "av==18.1.0",
  "Pillow==12.1.0",
  "qwen-vl-utils==0.0.14",
  "sentence-transformers==5.4.0",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "transformers==4.57.6",
]
dev = [
  "httpx==0.28.1",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.3.0",
  "ruff==0.16.6",
  "types-PyYAML==6.0.12.20260906",
  "types-psutil==7.2.2.20260906",
]

[project.scripts]
local-ai-doctor = "local_ai_doctor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/local_ai_doctor"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
pythonpath = ["backend"]
testpaths = ["tests"]
markers = [
  "real_model: requires local multi-gigabyte model files",
  "gpu: requires a CUDA-capable device",
  "performance: repeatable performance or overhead test",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["local_ai_doctor"]
mypy_path = "backend"
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "PIL",
  "av",
  "transformers.*",
  "torch.*",
  "sentence_transformers.*",
]
ignore_missing_imports = true
