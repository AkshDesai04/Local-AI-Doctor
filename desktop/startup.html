<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starting Local AI Doctor</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "Segoe UI", sans-serif;
        background: #080d14;
        color: #edf5ff;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 35%, rgba(45, 126, 247, 0.16), transparent 32rem),
          #080d14;
      }

      main {
        width: min(34rem, calc(100vw - 3rem));
        text-align: center;
      }

      .mark {
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto 1.5rem;
        display: grid;
        place-items: center;
        border: 1px solid rgba(96, 165, 250, 0.5);
        border-radius: 1rem;
        background: rgba(30, 64, 175, 0.35);
        color: #60a5fa;
        font-size: 1.65rem;
      }

      h1 {
        margin: 0;
        font-size: 1.55rem;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0.7rem 0 1.75rem;
        color: #9fb0c5;
        line-height: 1.55;
      }

      .track {
        height: 0.3rem;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.16);
      }

      .bar {
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #2563eb, #60a5fa);
        animation: travel 1.25s ease-in-out infinite;
      }

      @keyframes travel {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(345%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .bar {
          width: 100%;
          opacity: 0.7;
          animation: none;
        }
      }

      .note {
        margin-top: 1rem;
        font-size: 0.82rem;
        color: #718198;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">✦</div>
      <h1>Starting Local AI Doctor</h1>
      <p id="startup-status">The local backend is starting. The interface will open as soon as its database, model worker, and registry are ready.</p>
      <div class="track" role="progressbar" aria-label="Application startup in progress">
        <div class="bar"></div>
      </div>
      <div class="note">Models remain on this device.</div>
    </main>
  </body>
</html>
